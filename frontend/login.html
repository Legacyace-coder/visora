<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in | Visora</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/visora-inc-favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/visora-inc-favicon-180.png">
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="wordmark brand-logo" href="/" aria-label="Visora home"><img class="logo-on-light" src="/images/visora-inc-logo-light-750.png" alt="Visora" width="750" height="280"><img class="logo-on-dark" src="/images/visora-inc-logo-dark-750.png" alt="Visora" width="750" height="280"></a>
    <div class="auth-actions">
      <a class="auth-home-link" href="/"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/></svg><span>Back to home</span></a>
      <button class="theme-toggle" type="button" data-theme-toggle hidden><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>Dark mode</span></button>
    </div>
  </header>

  <figure class="auth-visual">
    <img src="/images/collection-editorial.jpg" alt="Cameras and photographic contact sheets arranged on a table">
    <figcaption>YOUR PERSPECTIVE / YOUR WORK</figcaption>
  </figure>

  <main class="auth">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Sign in.</h1>
    <p class="lead">Access your account and continue where you left off.</p>

    <form id="login-form">
      <label>Email address
        <input name="email" type="email" autocomplete="email" required>
      </label>

      <label for="login-password">Password</label>
      <div class="password-field">
        <input id="login-password" name="password" type="password"
          autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-password-toggle aria-controls="login-password" aria-label="Show password" hidden>
          <svg data-password-show-icon aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg data-password-hide-icon aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" hidden><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path d="M3 3l18 18"></path></svg>
        </button>
      </div>

      <button class="button button-dark" type="submit">
        Continue →
      </button>

      <p id="form-message" role="status" aria-live="polite"></p>
    </form>

    <p class="switch">
      New here? <a href="/register.html">Create an account</a>
    </p>
  </main>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
