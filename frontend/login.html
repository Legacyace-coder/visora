<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="api-base-url" content="http://127.0.0.1:8000">
  <title>Sign in | Visora</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="auth-page">
  <a class="wordmark" href="/">VISORA<span>Â®</span></a>

  <main class="auth">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Sign in.</h1>
    <p class="lead">Access your account and continue where you left off.</p>

    <form id="login-form">
      <label>Email address
        <input name="email" type="email" autocomplete="email" required>
      </label>

      <label>Password
        <input name="password" type="password"
          autocomplete="current-password" required>
      </label>

      <button class="button button-dark" type="submit">
        Continue â†’
      </button>

      <p id="form-message" role="status" aria-live="polite"></p>
    </form>

    <p class="switch">
      New here? <a href="/register.html">Create an account</a>
    </p>
  </main>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
