<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="api-base-url" content="http://127.0.0.1:8000">
  <title>Gallery | Visora</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/visora-inc-favicon-32.png">
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark brand-logo" href="/" aria-label="Visora home"><img class="logo-on-light" src="/images/visora-inc-logo-light-750.png" alt="Visora" width="750" height="280"><img class="logo-on-dark" src="/images/visora-inc-logo-dark-750.png" alt="Visora" width="750" height="280"></a>
    <nav id="site-menu" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/collection.html">Collection</a>
      <a href="/gallery.html" aria-current="page">Gallery</a>
      <a href="/photographers.html">Photographers</a>
      <a href="/about.html">About</a>
    </nav>
    <div class="header-actions">
      <label class="language-picker"><span>Language</span>
        <svg class="language-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.400 5.700 12 3z"/></svg>
        <select id="home-language" aria-label="Language">
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어 (North / South)</option>
          <option value="zh">简体中文</option>
          <option value="vi">Tiếng Việt</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </label>
      <a href="/login.html">Sign in</a><button class="theme-toggle" type="button" data-theme-toggle hidden><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>Dark mode</span></button></div>
        <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><span></span><span></span><span></span></button>
  </header>
  <main class="inner-page">
    <section class="page-hero">
      <p class="eyebrow">VISORA GALLERY</p>
      <h1>Photography,<br><em>shared.</em></h1>
      <p class="lead">Works shared with permission from their photographers.</p>
      <div class="photo-carousel page-carousel" data-photo-carousel role="region" aria-roledescription="carousel" aria-label="Editorial imagery about photography">
        <figure class="photo-slide" data-photo-slide><img src="/images/image%207.jpg" alt="Cameras, film and portrait photographs arranged on a table" loading="lazy"><figcaption>EDITORIAL IMAGERY / BEHIND THE LENS</figcaption></figure>
        <figure class="photo-slide" data-photo-slide hidden><img src="/images/image%208.jpg" alt="Cameras and instant portraits arranged on a wooden surface" loading="lazy"><figcaption>EDITORIAL IMAGERY / PORTRAITS</figcaption></figure>
        <div class="photo-carousel-controls" data-carousel-controls hidden><button type="button" data-carousel-prev aria-label="Previous photograph">←</button><span data-carousel-status aria-live="polite"></span><button type="button" data-carousel-next aria-label="Next photograph">→</button></div>
      </div>
    </section>
    <section class="portfolio-section" aria-label="Published photographs">
      <p id="public-gallery-status" role="status" aria-live="polite">Loading gallery...</p>
      <div id="public-gallery" class="portfolio-grid"></div>
      <button id="public-gallery-more" class="button button-dark small" type="button" hidden>Load more photographs</button>
    </section>
  </main>
  <script src="/assets/js/home-language.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
